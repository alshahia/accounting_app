name: almahmoud-erp

# Local/CI stack. The database password is supplied through the environment
# (see .env.example); never commit a real credential.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: almahmoud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (development only)}
      POSTGRES_DB: almahmoud
    ports:
      - "55432:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA under a mount at /var/lib/postgresql;
      # mounting .../data directly makes the entrypoint refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almahmoud -d almahmoud"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      MAHMOUD_ENVIRONMENT: development
      MAHMOUD_LOG_LEVEL: INFO
      MAHMOUD_DATABASE_URL: postgresql+asyncpg://almahmoud:${POSTGRES_PASSWORD:?}@db:5432/almahmoud
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  pgdata:
