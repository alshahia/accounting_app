name: almahmoud-erp-prod

# Production manifest (T-31, AC-14..AC-17).
#
#   deploy/generate-certs.ps1 -DnsName erp.example.local
#   $env:POSTGRES_PASSWORD = '<strong password>'
#   $env:MAHMOUD_JWT_SECRET = '<at least 32 random bytes>'
#   $env:MAHMOUD_BOOTSTRAP_TOKEN = '<at least 32 random bytes>'
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# The database publishes no host port, the API is reachable only through the TLS
# gateway, and migrations run as a separate one-shot service from the pinned
# virtualenv instead of being launched by the API command.

x-common-environment: &common-environment
  MAHMOUD_ENVIRONMENT: production
  MAHMOUD_LOG_LEVEL: ${MAHMOUD_LOG_LEVEL:-INFO}
  MAHMOUD_DATABASE_URL: postgresql+asyncpg://almahmoud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/almahmoud
  MAHMOUD_PROVISION_DATABASE_URL: postgresql+asyncpg://almahmoud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/almahmoud
  MAHMOUD_JWT_SECRET: ${MAHMOUD_JWT_SECRET:?set MAHMOUD_JWT_SECRET}
  MAHMOUD_BOOTSTRAP_TOKEN: ${MAHMOUD_BOOTSTRAP_TOKEN:?set MAHMOUD_BOOTSTRAP_TOKEN}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: almahmoud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: almahmoud
    # Deliberately no ports: nothing on the host may reach the database directly.
    # WAL archiving is the second half of recovery: the encrypted pg_dump gives a
    # consistent daily restore point, the archived WAL segments allow replay to
    # any moment after the last base copy. Segments stay inside the data volume
    # (the postgres user owns PGDATA); the backup runbook copies them off-host
    # nightly onto operator-encrypted storage. See docs/10-runbooks/backup-restore.md.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - "-c"
      # $$ escapes compose interpolation so the shell in archive_command sees $PGDATA.
      - "archive_command=test ! -f $$PGDATA/pg_wal_archive/%f && mkdir -p $$PGDATA/pg_wal_archive && cp %p $$PGDATA/pg_wal_archive/%f"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almahmoud -d almahmoud"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  migrate:
    image: almahmoud-erp-api:${MAHMOUD_IMAGE_TAG:-prod}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *common-environment
    command: ["/srv/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api:
    image: almahmoud-erp-api:${MAHMOUD_IMAGE_TAG:-prod}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment: *common-environment
    # No published port: the gateway is the only way in.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "/srv/.venv/bin/python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
        reservations:
          memory: 256m

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "${MAHMOUD_HTTP_PORT:-80}:80"
      - "${MAHMOUD_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
