# TLS terminus for the production stack (T-31, AC-14/AC-16).
# The API never publishes a port; the only reachable entry point is this server.
# Security headers are also set by the API (defence in depth): HSTS here covers
# the static assets and any response nginx itself generates.
#
# The peer every proxy site below forwards ($remote_addr) is Docker's
# published-port proxy, not the end client's IP: every LAN client arrives
# through that one address, so the API records the same peer for all of them and
# keeps a single global login-limiter bucket (documented residual, T-38 review).

# Plain HTTP. The health probes are forwarded so an operator, the runbook and an
# external monitor get a real 200 over http:// - they are not redirected. Every
# other path still redirects to TLS, and that redirect cannot name the
# host-published HTTPS port (nginx does not know it), so it points at :443 and is
# correct only when the gateway publishes 443 (T-38).
server {
    listen 80;
    server_name _;

    location = /api/v1/health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /api/v1/health/ready {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:almahmoud_tls:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;
    server_tokens off;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts these headers only because it publishes no port and this
        # server overwrites them with the peer: a client cannot prepend an
        # address to the chain. That peer is Docker's published-port proxy,
        # shared by every LAN client - it is not the end client's IP.
        # tests/unit/test_deploy_config.py guards the lines (exactly one
        # X-Forwarded-For directive per proxy site, always $remote_addr).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
